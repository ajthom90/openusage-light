# Generates OpenUsageLight.xcodeproj (gitignored): `cd iOS && xcodegen`. Personal values (team, identifiers,
# iCloud container) come from Config/Local.xcconfig, which git ignores; see Config/Local.xcconfig.example.
name: OpenUsageLight
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "18.0"
packages:
  OpenUsage:
    path: ..
targets:
  OpenUsageLight:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: OpenUsage
        product: OpenUsageMobile
    entitlements:
      path: App/OpenUsageLight.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: ["$(ICLOUD_CONTAINER)"]
        com.apple.developer.icloud-services: [CloudKit]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OpenUsage Light
        ICloudContainer: $(ICLOUD_CONTAINER)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
  OpenUsageMacSigning:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [MacSigning]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mac
        PRODUCT_NAME: OpenUsageMacSigning
        CODE_SIGN_ENTITLEMENTS: MacSigning/OpenUsageMacSigning.entitlements
        GENERATE_INFOPLIST_FILE: YES
