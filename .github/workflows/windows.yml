name: Windows

# Builds and tests the Windows programs, packages them, and then runs the package on a fresh runner that
# has never had Swift installed, to prove the zip carries everything it needs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows.yml"
      - "Package.swift"
      - "script/package_windows.cmd"
      - "script/installer.iss"
      - "Sources/OpenUsageCore/**"
      - "Sources/OpenUsageWindows*/**"
      - "Tests/OpenUsageCoreTests/**"
      - "Tests/OpenUsageWindowsTests/**"

permissions:
  contents: read

jobs:
  build:
    name: Build and package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, swift_arch: amd64 }
          - { arch: arm64, runner: windows-11-arm, swift_arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
          build_arch: ${{ matrix.swift_arch }}

      # The Visual Studio build tools environment for this architecture, which the Swift linker needs.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Tests (core and Windows)
        shell: cmd
        run: swift test

      - name: Package
        shell: cmd
        run: script\package_windows.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUsageLight-windows-${{ matrix.arch }}
          path: dist/OpenUsageLight-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  verify:
    name: Run the package on a clean machine (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    steps:
      # Deliberately no checkout and no Swift: only the zip.
      - uses: actions/download-artifact@v4
        with:
          name: OpenUsageLight-windows-${{ matrix.arch }}

      - name: This machine has no Swift
        shell: pwsh
        run: |
          if (Get-Command swift -ErrorAction SilentlyContinue) { throw "swift is installed on this runner" }
          if (Get-Command swiftCore.dll -ErrorAction SilentlyContinue) { throw "the Swift runtime is on this runner's PATH" }
          "no swift, no Swift runtime on PATH"

      - name: Extract
        shell: pwsh
        run: |
          tar -xf OpenUsageLight-windows-${{ matrix.arch }}.zip
          Get-ChildItem OpenUsageLight-windows-${{ matrix.arch }} -Filter *.exe | Select-Object Name, Length
          "libraries: " + (Get-ChildItem OpenUsageLight-windows-${{ matrix.arch }} -Filter *.dll).Count

      - name: Run with only the Windows folders on PATH
        shell: pwsh
        run: |
          $dir = (Resolve-Path "OpenUsageLight-windows-${{ matrix.arch }}").Path
          $env:PATH = "C:\Windows\System32;C:\Windows"

          $version = & "$dir\openusage.exe" --version
          "openusage --version -> $version (exit $LASTEXITCODE)"
          if ($LASTEXITCODE -ne 0 -or $version -ne "0.1.0") { throw "openusage did not run" }

          $limits = & "$dir\openusage.exe" | Out-String
          "openusage with no accounts -> exit $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0 -or $limits -notmatch "openusage.limits.v1") { throw "openusage printed no document" }

          $snapshot = Join-Path $dir "popover.bmp"
          $p = Start-Process "$dir\OpenUsageLight.exe" -ArgumentList "--demo","--light","--snapshot",$snapshot -Wait -PassThru
          "tray app --snapshot -> exit $($p.ExitCode), $((Get-Item $snapshot).Length) bytes"
          if ($p.ExitCode -ne 0 -or (Get-Item $snapshot).Length -lt 100000) { throw "the tray app did not render" }

      - name: The check can fail (a library removed)
        shell: pwsh
        run: |
          $dir = (Resolve-Path "OpenUsageLight-windows-${{ matrix.arch }}").Path
          Rename-Item "$dir\swiftCore.dll" "swiftCore.hidden"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process "$dir\openusage.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          "without swiftCore.dll -> exit $($p.ExitCode)"
          if ($p.ExitCode -eq 0) { throw "the program ran without a bundled library, so this check proves nothing" }

  installer:
    name: Build the installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: OpenUsageLight-windows-*
          path: zips
          merge-multiple: true

      - name: Unpack both builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in "x64", "arm64") { tar -xf "zips/OpenUsageLight-windows-$arch.zip" -C dist }
          $version = & "dist\OpenUsageLight-windows-x64\openusage.exe" --version
          "version=$version" >> $env:GITHUB_ENV

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:version" script\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist\OpenUsageLight-Setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUsageLight-Setup
          path: dist/OpenUsageLight-Setup.exe
          if-no-files-found: error

  verify-installer:
    name: Install, run, and uninstall (${{ matrix.arch }})
    needs: installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenUsageLight-Setup

      - name: Install silently
        shell: pwsh
        run: |
          $p = Start-Process .\OpenUsageLight-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=addtopath","/LOG=$PWD\setup.log" -Wait -PassThru
          "setup exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 40; throw "setup failed" }
          $dir = "$env:LOCALAPPDATA\Programs\OpenUsage Light"
          Get-ChildItem $dir -Filter *.exe | Select-Object Name, Length
          "libraries: " + (Get-ChildItem $dir -Filter *.dll).Count
          # The architecture Setup picked must be this machine's own.
          $machine = if ("${{ matrix.arch }}" -eq "arm64") { 0xAA64 } else { 0x8664 }
          $bytes = [IO.File]::ReadAllBytes("$dir\OpenUsageLight.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $type = [BitConverter]::ToUInt16($bytes, $pe + 4)
          "installed exe machine type 0x{0:X}" -f $type
          if ($type -ne $machine) { throw "installed the wrong architecture" }

      - name: Run the installed programs
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\OpenUsage Light"
          # The PATH entry written by Setup is in the user's registry value; a new process would see it.
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*$dir*") { throw "the openusage folder was not added to PATH" }
          $env:PATH = "C:\Windows\System32;C:\Windows;$dir"
          $version = openusage --version
          "openusage --version -> $version (exit $LASTEXITCODE)"
          if ($LASTEXITCODE -ne 0) { throw "openusage did not run from PATH" }
          $p = Start-Process "$dir\OpenUsageLight.exe" -ArgumentList "--demo","--light","--snapshot","$PWD\popover.bmp" -Wait -PassThru
          "tray app --snapshot -> exit $($p.ExitCode), $((Get-Item popover.bmp).Length) bytes"
          if ($p.ExitCode -ne 0) { throw "the tray app did not render" }

      - name: Uninstall
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\OpenUsage Light"
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          "uninstall exit code $($p.ExitCode)"
          Start-Sleep 3
          if (Test-Path "$dir\OpenUsageLight.exe") { throw "program files remain after uninstall" }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -like "*OpenUsage Light*") { throw "PATH entry remains" }
          "removed"
